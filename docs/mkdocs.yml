site_name: Cursor Agent Skills
site_description: Reference and recipes for agent skills—aligned implementation, TDD, PRD workflows, Neon, and more.
site_url: https://maccalsa.github.io/skills/
repo_url: https://github.com/maccalsa/skills
edit_uri: edit/main/docs/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Skills:
      - Catalog: skills/index.md
      - aligned-implementation: skills/aligned-implementation.md
      - create-rule: skills/create-rule.md
      - create-skill: skills/create-skill.md
      - create-subagent: skills/create-subagent.md
      - design-an-interface: skills/design-an-interface.md
      - greenfield-scaffold: skills/greenfield-scaffold.md
      - grill-me: skills/grill-me.md
      - improve-codebase-architecture: skills/improve-codebase-architecture.md
      - inherited-codebase-onboarding: skills/inherited-codebase-onboarding.md
      - issue-to-pr: skills/issue-to-pr.md
      - migrate-to-skills: skills/migrate-to-skills.md
      - mirror-repo-github: skills/mirror-repo-github.md
      - neon-postgres: skills/neon-postgres.md
      - neon-postgres-egress-optimizer: skills/neon-postgres-egress-optimizer.md
      - prd-critique: skills/prd-critique.md
      - to-issues: skills/to-issues.md
      - prd-to-plan: skills/prd-to-plan.md
      - request-refactor-plan: skills/request-refactor-plan.md
      - requirement-course-correction: skills/requirement-course-correction.md
      - tdd: skills/tdd.md
      - tech-lead-jira-tickets: skills/tech-lead-jira-tickets.md
      - tech-lead-unblock: skills/tech-lead-unblock.md
      - triage-issue: skills/triage-issue.md
      - ubiquitous-language: skills/ubiquitous-language.md
      - update-cursor-settings: skills/update-cursor-settings.md
      - x-dotfiles-script: skills/x-dotfiles-script.md
  - Recipes:
      - Calendar refresh (end-to-end): recipes/end-to-end-flow.md
      - "x-dotfiles-script": recipes/x-dotfiles-script.md
  - Cookbook:
      - Quick examples: cookbook/quick-examples.md
      - "Tech lead case study (PR tension)": cookbook/tech-lead-case-study.md
      - x-dotfiles-script: cookbook/x-dotfiles-script.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  # Mermaid diagrams: Material loads Mermaid.js; no extra pip package needed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maccalsa/skills
