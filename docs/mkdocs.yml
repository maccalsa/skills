site_name: Maccalsa Agent Skills
site_description: AI-agnostic agent skills with MkDocs documentation.
site_url: https://maccalsa.github.io/skills/
repo_url: https://github.com/maccalsa/skills
edit_uri: edit/main/docs/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Skills:
      - Catalog: skills/index.md
      - ask-skills: skills/ask-skills.md
      - branch-diff-code-review: skills/branch-diff-code-review.md
      - code-review: skills/code-review.md
      - codebase-design: skills/codebase-design.md
      - diagnosing-bugs: skills/diagnosing-bugs.md
      - domain-modeling: skills/domain-modeling.md
      - git-recent-commits-report: skills/git-recent-commits-report.md
      - grill-with-docs: skills/grill-with-docs.md
      - implement: skills/implement.md
      - improve-codebase-architecture: skills/improve-codebase-architecture.md
      - karpathy-guidelines: skills/karpathy-guidelines.md
      - mirror-repo-github: skills/mirror-repo-github.md
      - neon-postgres: skills/neon-postgres.md
      - neon-postgres-egress-optimizer: skills/neon-postgres-egress-optimizer.md
      - prototype: skills/prototype.md
      - repository-understanding: skills/repository-understanding.md
      - research: skills/research.md
      - resolving-merge-conflicts: skills/resolving-merge-conflicts.md
      - setup-agent-skills: skills/setup-agent-skills.md
      - tdd: skills/tdd.md
      - to-tickets: skills/to-tickets.md
      - to-spec: skills/to-spec.md
      - triage: skills/triage.md
      - wayfinder: skills/wayfinder.md
      - x-dotfiles-script: skills/x-dotfiles-script.md
      - edit-article: skills/edit-article.md
      - caveman: skills/caveman.md
      - fable-orchestration: skills/fable-orchestration.md
      - frontend-design: skills/frontend-design.md
      - grill-me: skills/grill-me.md
      - grilling: skills/grilling.md
      - handoff: skills/handoff.md
      - teach: skills/teach.md
      - write-a-skill: skills/write-a-skill.md
      - write-like-me: skills/write-like-me.md
      - writing-great-skills: skills/writing-great-skills.md
      - zoom-out: skills/zoom-out.md
  - Recipes:
      - End-to-end flow: recipes/end-to-end-flow.md
      - x-dotfiles-script: recipes/x-dotfiles-script.md
  - Cookbook:
      - Quick examples: cookbook/quick-examples.md
      - Review tension case study: cookbook/tech-lead-case-study.md
      - x-dotfiles-script: cookbook/x-dotfiles-script.md

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/maccalsa/skills
